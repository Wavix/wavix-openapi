name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: GitHub release from the tag annotation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md

  sdks:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [typescript-sdk, python-sdk, ruby-sdk, go-sdk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fern PR for ${{ matrix.group }}
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g "fern-api@$(jq -r .version fern/fern.config.json)"
          fern generate --group "${{ matrix.group }}" --version "${GITHUB_REF_NAME#v}" --force --log-level info
